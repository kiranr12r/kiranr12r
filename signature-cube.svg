<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3d46"/>
      <stop offset="100%" stop-color="#1c1e24"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191b20"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26282e"/>
      <stop offset="100%" stop-color="#121317"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a86a" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#6fb8c9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6fb8c9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="edgeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- floating + gentle oscillating rotation, never a full spin -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 0,-6; 0,0; 0,5; 0,0" keyTimes="0;0.25;0.5;0.75;1"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="-3;3;-3" keyTimes="0;0.5;1"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      dur="12s" repeatCount="indefinite"/>

    <!-- ambient glow behind cube, representing internal light source -->
    <circle cx="100" cy="100" r="55" fill="url(#innerGlow)" filter="url(#softBlur)">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    </circle>

    <!-- isometric cube -->
    <g>
      <polygon points="100,40 150,65 100,90 50,65" fill="url(#faceTop)" stroke="#454850" stroke-width="0.6"/>
      <polygon points="50,65 100,90 100,150 50,125" fill="url(#faceLeft)" stroke="#2a2c32" stroke-width="0.6"/>
      <polygon points="150,65 100,90 100,150 150,125" fill="url(#faceRight)" stroke="#33353c" stroke-width="0.6"/>

      <!-- tiny circuit traces -->
      <path d="M65,72 L85,82 M85,82 L85,110 M120,80 L120,105 M120,105 L138,115"
        stroke="#c9a86a" stroke-width="0.7" fill="none" opacity="0.55"/>

      <!-- data nodes, pulsing gently at different phases -->
      <circle cx="85" cy="82" r="2.4" fill="#6fb8c9" filter="url(#edgeGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="85" cy="110" r="2" fill="#c9a86a" filter="url(#edgeGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="105" r="2.2" fill="#6fb8c9" filter="url(#edgeGlow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="138" cy="115" r="1.8" fill="#c9a86a" filter="url(#edgeGlow)">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s" repeatCount="indefinite"/>
      </circle>

      <!-- minimal code fragment etched on top face -->
      <text x="82" y="63" font-family="Courier New, monospace" font-size="8" fill="#8b8f98" opacity="0.6">01</text>
    </g>
  </g>
</svg>
