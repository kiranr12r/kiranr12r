<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="pBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#15171d"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </radialGradient>
    <radialGradient id="lens" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4a5560"/>
      <stop offset="70%" stop-color="#1a1c22"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </radialGradient>
    <filter id="pGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <rect width="320" height="180" rx="12" fill="url(#pBg)"/>

  <!-- body of camera, isometric block -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="8s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    <rect x="70" y="70" width="80" height="55" rx="8" fill="#1c1e24" stroke="#33353c"/>
    <circle cx="110" cy="97" r="26" fill="url(#lens)" stroke="#454850"/>
    <circle cx="110" cy="97" r="8" fill="#6fb8c9" opacity="0.55" filter="url(#pGlow)">
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- oscillating scan arc (not a continuous spin) -->
  <g stroke="#c9a86a" stroke-width="1.2" fill="none" opacity="0.5">
    <path d="M110,97 m-40,0 a40,40 0 0 1 60,-32">
      <animateTransform attributeName="transform" type="rotate" values="0 110 97;70 110 97;0 110 97" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- face-recognition node network -->
  <g stroke="#5b6572" stroke-width="0.8" opacity="0.4">
    <path d="M200,50 L230,75 L215,110 L235,140"/>
  </g>
  <g>
    <circle cx="200" cy="50" r="3" fill="#6fb8c9" filter="url(#pGlow)"><animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="75" r="2.6" fill="#c9a86a" filter="url(#pGlow)"><animate attributeName="opacity" values="1;0.4;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="215" cy="110" r="2.8" fill="#6fb8c9" filter="url(#pGlow)"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="235" cy="140" r="2.4" fill="#c9a86a" filter="url(#pGlow)"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s" repeatCount="indefinite"/></circle>
  </g>

  <text x="20" y="164" font-family="Courier New, monospace" font-size="11" fill="#8b8f98" opacity="0.6">AI Proctoring · vision network</text>
</svg>
