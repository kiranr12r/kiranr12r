<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="mBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#15171d"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242730"/>
      <stop offset="100%" stop-color="#121317"/>
    </linearGradient>
    <filter id="mGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <rect width="320" height="180" rx="12" fill="url(#mBg)"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0;0,3;0,0" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="10s" repeatCount="indefinite"/>
    <polygon points="60,120 160,80 260,120 160,160" fill="url(#plane)" stroke="#33353c"/>
    <g stroke="#2c2e35" stroke-width="0.6" opacity="0.7">
      <path d="M90,110 L190,70 M120,140 L220,100 M100,95 L230,145"/>
    </g>
  </g>

  <!-- connected location pins -->
  <g stroke="#5b6572" stroke-width="0.8" opacity="0.4">
    <path d="M120,105 L165,95 L205,112 L180,135"/>
  </g>
  <g>
    <circle cx="120" cy="105" r="3" fill="#6fb8c9" filter="url(#mGlow)"><animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="165" cy="95" r="2.6" fill="#c9a86a" filter="url(#mGlow)"><animate attributeName="opacity" values="1;0.4;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="112" r="2.8" fill="#6fb8c9" filter="url(#mGlow)"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="135" r="2.4" fill="#c9a86a" filter="url(#mGlow)"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s" repeatCount="indefinite"/></circle>
  </g>

  <text x="20" y="164" font-family="Courier New, monospace" font-size="11" fill="#8b8f98" opacity="0.6">Local Services Finder · location graph</text>
</svg>
