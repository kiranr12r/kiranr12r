<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#15171d"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3d46"/>
      <stop offset="100%" stop-color="#16171c"/>
    </linearGradient>
    <filter id="sGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <rect width="320" height="180" rx="12" fill="url(#sBg)"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="8.5s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>

    <!-- floating platform -->
    <polygon points="40,140 160,110 280,140 160,170" fill="#121317" stroke="#2a2c32"/>

    <!-- bars, gentle breathing height -->
    <g>
      <rect x="80" y="80" width="14" height="45" fill="url(#bar)" stroke="#33353c">
        <animate attributeName="height" values="45;52;45" dur="6s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
        <animate attributeName="y" values="80;73;80" dur="6s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      </rect>
      <rect x="110" y="60" width="14" height="65" fill="url(#bar)" stroke="#33353c">
        <animate attributeName="height" values="65;58;65" dur="7s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
        <animate attributeName="y" values="60;67;60" dur="7s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      </rect>
      <rect x="140" y="45" width="14" height="80" fill="url(#bar)" stroke="#33353c">
        <animate attributeName="height" values="80;88;80" dur="5.5s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
        <animate attributeName="y" values="45;37;45" dur="5.5s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- slow-drawing trend line -->
    <path d="M75,95 L110,72 L140,88 L175,50 L210,64" fill="none" stroke="#c9a86a" stroke-width="1.6" stroke-linecap="round" opacity="0.75" stroke-dasharray="220" stroke-dashoffset="220">
      <animate attributeName="stroke-dashoffset" values="220;0;0;220" keyTimes="0;0.5;0.85;1" dur="10s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </path>
    <circle cx="210" cy="64" r="3" fill="#c9a86a" filter="url(#sGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="20" y="164" font-family="Courier New, monospace" font-size="11" fill="#8b8f98" opacity="0.6">Stock Dashboard · live market graph</text>
</svg>
